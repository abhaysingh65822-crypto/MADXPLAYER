
name: Build MADXPLAYER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MADXPLAYER APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract MADXPLAYER project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="MADXPLAYER_UPGRADED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            ls -la
            exit 1
          fi

          rm -rf _madx_build
          mkdir -p _madx_build
          unzip -q "$ZIP_FILE" -d _madx_build

          echo "=== ZIP contents ==="
          find _madx_build -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find _madx_build -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found."
            find _madx_build -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Building in $(pwd)"
          java -version
          gradle --version

          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$PROJECT_DIR" -type f | sort
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MADXPLAYER_APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
          2
