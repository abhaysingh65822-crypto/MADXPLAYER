
name: Unpack MADXPLAYER Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f MADXPLAYER_UPGRADED.zip
          mkdir -p /tmp/madx-project
          unzip -oq MADXPLAYER_UPGRADED.zip -d /tmp/madx-project
          cp -a /tmp/madx-project/. .
          rm -rf /tmp/madx-project
          rm -f MADXPLAYER_UPGRADED.zip
          git status --short

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract MADXPLAYER source files"
            git push
          fi
          
